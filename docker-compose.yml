services:
  db:
    image: postgres:15-alpine
    # 300 Connections for D4s_v3 (4 vCPU, 16GB RAM) - supports 100+ teams
    command:
      ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    container_name: uol_judge_db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: uol0512
      POSTGRES_DB: uol_judge
    volumes:
      - ./pg-data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # Health check ensures App doesn't crash on startup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d uol_judge"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - uol-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G # D4s_v3: Increased for 100+ team queries

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: uol_judge_app
    ports:
      - "3000:3000"
    environment:
      # D4s_v3: Increased connection pool for 100+ teams
      DATABASE_URL: "postgresql://admin:uol0512@db:5432/uol_judge?connection_limit=50"

      # 🛑 CRITICAL: JWT Secret for session encryption (change in production!)
      JWT_SECRET: "uoljudge-production-secret-change-this-2024"

      # 🛑 CRITICAL: This MUST match your current Cloudflare Socket URL
      NEXT_PUBLIC_WS_URL: ws://13.71.29.115:3001

      # Internal networking for Docker-to-Docker communication
      INTERNAL_WS_URL: http://ws-server:3001

      # Fix for login loop on HTTP/Tunnel
      FORCE_INSECURE_COOKIES: "true"

      # Storage directory for file uploads
      UPLOAD_DIR: "/app/storage"

      NODE_ENV: "production"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - uol-network
    # AZURE FIX: Run as root to avoid permission issues with mounted volumes
    # The host ./uploads folder may have different ownership than container UID 1001
    user: root
    volumes:
      # PERSISTENCE: Maps Azure VM disk to container storage directory
      - ./uploads:/app/storage
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: ["node", "server.js"]
    deploy:
      resources:
        limits:
          cpus: "2.5" # D4s_v3: Primary compute for SSR + Prisma
          memory: 2G # D4s_v3: Handles large file uploads + concurrent requests

  ws-server:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: uol_judge_ws
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: "production"
    restart: always
    networks:
      - uol-network
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: ["npx", "tsx", "server/ws-server.ts"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M # D4s_v3: More headroom for 200+ connections

  backup:
    image: postgres:15-alpine
    container_name: uol_judge_backup
    depends_on:
      - db
    volumes:
      - ./backups:/backups
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      PGHOST: db
      PGUSER: admin
      PGPASSWORD: uol0512
      PGDATABASE: uol_judge
    restart: always
    networks:
      - uol-network
    command: >
      sh -c '
      echo "✅ Backup Service Started...";
      while true; do
        sleep 600;
        DATE=$$(date +%Y%m%d_%H%M%S);
        pg_dump -U admin -h db uol_judge > /backups/backup_$$DATE.sql;
        echo "💾 Backup created: backup_$$DATE.sql";
        ls -t /backups/*.sql | tail -n +6 | xargs -r rm;
        echo "🧹 Cleanup complete. Keeping last 5 backups.";
      done'
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

networks:
  uol-network:
    driver: bridge
