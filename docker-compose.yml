version: "3.9"
services:
  db:
    image: postgres:15-alpine
    # 200 Connections allows plenty of overhead for Admin + 40 Teams
    command: ["postgres", "-c", "max_connections=200"]
    container_name: uol_judge_db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: uol0512
      POSTGRES_DB: uol_judge
    volumes:
      - ./pg-data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # Health check ensures App doesn't crash on startup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d uol_judge"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - uol-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M # Optimized: DB is efficient, save RAM for App

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ""
        https_proxy: ""
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        no_proxy: "*"
        NO_PROXY: "*"
    container_name: uol_judge_app
    ports:
      - "3000:3000"
    environment:
      # Connection limit set to prevent App from hogging all DB slots
      DATABASE_URL: "postgresql://admin:uol0512@db:5432/uol_judge?connection_limit=20"

      # 🛑 CRITICAL: This MUST match your current Cloudflare Socket URL
      NEXT_PUBLIC_WS_URL: ws://localhost:3001

      # Internal networking for Docker-to-Docker communication
      INTERNAL_WS_URL: http://ws-server:3001

      # Fix for login loop on HTTP/Tunnel
      FORCE_INSECURE_COOKIES: "true"

      NODE_ENV: "production"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - uol-network
    volumes:
      # PERSISTENCE: Saves student code to your Mac
      - ./uploads:/app/public/uploads
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: ["node", "server.js"]
    deploy:
      resources:
        limits:
          cpus: "2.0" # Performance: Increased to ensure fast UI rendering
          memory: 1G # Safety: Prevents crash during large file uploads

  ws-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ""
        https_proxy: ""
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        no_proxy: "*"
        NO_PROXY: "*"
    container_name: uol_judge_ws
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: "production"
    restart: always
    networks:
      - uol-network
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: ["npx", "tsx", "server/ws-server.ts"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M # WebSocket is lightweight

  backup:
    image: postgres:15-alpine
    container_name: uol_judge_backup
    depends_on:
      - db
    volumes:
      - ./backups:/backups
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      PGHOST: db
      PGUSER: admin
      PGPASSWORD: uol0512
      PGDATABASE: uol_judge
    restart: always
    networks:
      - uol-network
    command: >
      sh -c '
      echo "✅ Backup Service Started...";
      while true; do
        sleep 600;
        DATE=$$(date +%Y%m%d_%H%M%S);
        pg_dump -U admin -h db uol_judge > /backups/backup_$$DATE.sql;
        echo "💾 Backup created: backup_$$DATE.sql";
        ls -t /backups/*.sql | tail -n +6 | xargs -r rm;
        echo "🧹 Cleanup complete. Keeping last 5 backups.";
      done'
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

networks:
  uol-network:
    driver: bridge
