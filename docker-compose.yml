version: "3.9"

services:
  db:
    image: postgres:15-alpine
    command: ["postgres", "-c", "max_connections=200"]
    container_name: uol_judge_db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: uol0512
      POSTGRES_DB: uol_judge
    volumes:
      - ./pg-data:/var/lib/postgresql/data
      # HARDENING: Sync timezone with host to prevent UTC mismatch
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # HARDENING: Health check to prevent startup race conditions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d uol_judge"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - uol-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ""
        https_proxy: ""
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        no_proxy: "*"
        NO_PROXY: "*"
    container_name: uol_judge_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://admin:uol0512@db:5432/uol_judge?connection_limit=20"
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      
      # BUG FIX: Internal URL (For Docker-to-Docker communication)
      INTERNAL_WS_URL: http://ws-server:3001
      
      # BUG FIX: Allow HTTP authentication on LAN (no SSL)
      FORCE_INSECURE_COOKIES: "true"
      
      NODE_ENV: "production"
    # HARDENING: Wait for database to be healthy before starting
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - uol-network
    volumes:
      - ./uploads:/app/public/uploads
      # HARDENING: Sync timezone with host
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: ["node", "server.js"]

  ws-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ""
        https_proxy: ""
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        no_proxy: "*"
        NO_PROXY: "*"
    container_name: uol_judge_ws
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: "production"
    restart: always
    networks:
      - uol-network
    volumes:
      # HARDENING: Sync timezone with host
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: ["npx", "tsx", "server/ws-server.ts"]

networks:
  uol-network:
    driver: bridge
