version: "3.9"

services:
  db:
    image: postgres:15-alpine
    command: ["postgres", "-c", "max_connections=200"]
    container_name: uol_judge_db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: uol0512
      POSTGRES_DB: uol_judge
    volumes:
      - ./pg-data:/var/lib/postgresql/data
    restart: always
    networks:
      - uol-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ""
        https_proxy: ""
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        no_proxy: "*"
        NO_PROXY: "*"
    container_name: uol_judge_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://admin:uol0512@db:5432/uol_judge?connection_limit=20"
      NEXT_PUBLIC_WS_URL: "ws://localhost:3001"
      NODE_ENV: "production"
    depends_on:
      - db
    restart: always
    networks:
      - uol-network
    volumes:
      - ./uploads:/app/public/uploads
    command: ["node", "server.js"]

  ws-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ""
        https_proxy: ""
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        no_proxy: "*"
        NO_PROXY: "*"
    container_name: uol_judge_ws
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: "production"
    restart: always
    networks:
      - uol-network
    command: ["npx", "tsx", "server/ws-server.ts"]

networks:
  uol-network:
    driver: bridge
